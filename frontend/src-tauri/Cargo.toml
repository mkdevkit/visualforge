[package]
name = "visualforge"
version = "0.1.0"
description = "视铸 VisualForge"
authors = ["VisualForge"]
edition = "2021"

[lib]
name = "visualforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
